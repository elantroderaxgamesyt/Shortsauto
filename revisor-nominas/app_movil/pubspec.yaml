name: revisor_nominas
description: "Revisor de nóminas con IA (Android y Windows)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.1
  material_ui: ^1.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icono/icono.png
    - assets/demo/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/icono/icono.png
  adaptive_icon_foreground: assets/icono/icono_primer_plano.png
  adaptive_icon_background: assets/icono/icono_fondo.png
  windows:
    generate: true
    image_path: assets/icono/icono.png
    icon_size: 256
