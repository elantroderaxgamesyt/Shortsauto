name: Revisor de nóminas

on:
  push:
    paths: ["revisor-nominas/**", ".github/workflows/revisor-nominas.yml"]
  workflow_dispatch:

concurrency:
  group: revisor-nominas-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  # URL pública del servidor. Créala en Settings > Secrets and variables > Actions > Variables.
  API_URL: ${{ vars.NOMINAS_API_URL }}
  # AdMob (opcional). Sin estas variables se usan los anuncios de PRUEBA de Google.
  ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
  ADMOB_BANNER: ${{ vars.ADMOB_BANNER }}
  ADMOB_APERTURA: ${{ vars.ADMOB_APERTURA }}

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: revisor-nominas } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: revisor-nominas/app_movil } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Firma para Play Store. Secretos: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Sin ellos se firma con la clave de depuración.
      - name: Preparar firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASS" "$ALIAS" "$KEY_PASS" > android/key.properties
          else
            echo "::warning::Sin clave de firma: la APK/AAB no sirven para subir a Play Store."
          fi
      - name: Compilar APK y AAB
        run: |
          V="--build-number=${{ github.run_number }} --dart-define=API_URL=$API_URL"
          [ -n "$ADMOB_BANNER" ] && V="$V --dart-define=ADMOB_BANNER=$ADMOB_BANNER"
          [ -n "$ADMOB_APERTURA" ] && V="$V --dart-define=ADMOB_APERTURA=$ADMOB_APERTURA"
          [ -z "$ADMOB_APP_ID" ] && echo "::warning::Sin ADMOB_APP_ID: la app lleva anuncios de prueba."
          flutter build apk --release $V
          flutter build appbundle --release $V
      - uses: actions/upload-artifact@v4
        with:
          name: revisor-nominas-android
          path: |
            revisor-nominas/app_movil/build/app/outputs/flutter-apk/app-release.apk
            revisor-nominas/app_movil/build/app/outputs/bundle/release/app-release.aab
      # Prueba real: instala la APK en un emulador, la abre y comprueba que no se cierra.
      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba de arranque en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: revisor-nominas/app_movil
          script: bash tool/prueba_arranque_android.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Guardar resultado de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-arranque-android
          path: revisor-nominas/app_movil/prueba-arranque/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: revisor-nominas/app_movil } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=API_URL=${{ env.API_URL }}
      # Sin estas librerías de Microsoft el .exe no abre en PCs que no tengan instalado
      # el "Visual C++ Redistributable".
      - name: Añadir librerías de Visual C++
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Prueba de arranque en Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prueba-arranque | Out-Null
          $p = Start-Process build\windows\x64\runner\Release\revisor_nominas.exe -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("$PWD\prueba-arranque\pantalla.png")
          if ($p.HasExited) {
            Get-WinEvent -LogName Application -MaxEvents 15 | Format-List TimeCreated, ProviderName, Message
            Write-Error "La app se ha cerrado al abrirla (código $($p.ExitCode))"
            exit 1
          }
          Write-Host "La app sigue abierta"
          Stop-Process -Id $p.Id
      - name: Guardar resultado de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-arranque-windows
          path: revisor-nominas/app_movil/prueba-arranque/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: revisor-nominas-windows
          path: revisor-nominas/app_movil/build/windows/x64/runner/Release/
