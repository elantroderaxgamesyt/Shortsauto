name: Instalador Windows

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: instalador-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SHORTSAUTO_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Construir
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Prueba rápida (sin modelos)
        shell: pwsh
        run: |
          dist/ShortsAuto/python/python.exe -c "import sys; sys.path.insert(0, 'dist/ShortsAuto/src'); import shortsauto.pipeline, kokoro_onnx, PySide6.QtWidgets; print('ok')"
          dist/ShortsAuto/bin/ffmpeg.exe -hide_banner -filters | Select-String " ass "
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsAuto-Setup
          path: dist/ShortsAuto-Setup-*.exe
      # Instalación real: descarga los modelos y genera un vídeo con guion del LLM.
      # Se hace sobre una copia para no meter los modelos en el instalador.
      - name: Prueba completa (asistente + vídeo)
        shell: pwsh
        run: |
          Copy-Item dist/ShortsAuto smoke -Recurse
          smoke/python/python.exe packaging/smoke_test.py smoke
      - name: Guardar resultado de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-completa
          path: |
            smoke/output/
            smoke/logs/
          if-no-files-found: ignore
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SHORTSAUTO_VERSION }}
          name: ShortsAuto ${{ env.SHORTSAUTO_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/ShortsAuto-Setup-*.exe
